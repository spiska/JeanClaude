<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JeanClaude</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5f1; --panel: #ffffff; --text: #1d1c1a; --muted: #6f6c66; --line: #e2dfd8;
    --accent: #2563eb; --accent-text: #ffffff; --user: #ece9e1; --code: #f0eee8; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1917; --panel: #232220; --text: #ecebe7; --muted: #a09c94; --line: #36342f;
      --accent: #6ea8fe; --accent-text: #10213d; --user: #2f2d29; --code: #2a2926; --danger: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
  }
  button, select, input, textarea { font: inherit; color: inherit; }
  .btn, select {
    background: transparent; border: 1px solid var(--line); border-radius: 8px;
    padding: 4px 10px; cursor: pointer; min-height: 32px; font-size: 14.5px; white-space: nowrap;
  }
  select { min-width: 0; }
  /* Own arrow instead of the native one, which sits tight against the border. */
  .select { position: relative; display: inline-flex; min-width: 0; }
  .select select { appearance: none; -webkit-appearance: none; padding-right: 34px; }
  .select select option { background: var(--panel); color: var(--text); }
  .select svg { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--muted); }
  .btn:hover, select:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

  /* ---- sidebar: chat history ---- */
  aside {
    width: 268px; flex: none; display: flex; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--line);
  }
  aside .top { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  aside .top .btn { width: 100%; }
  #chats { list-style: none; margin: 0; padding: 8px; overflow-y: auto; flex: 1; }
  #chats li { display: flex; align-items: center; border-radius: 8px; }
  #chats li:hover, #chats li.active { background: var(--user); }
  #chats button { background: none; border: 0; cursor: pointer; border-radius: 8px; min-height: 34px; }
  #chats .open { flex: 1; min-width: 0; text-align: left; padding: 6px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #chats .del { flex: none; width: 32px; color: var(--muted); font-size: 18px; line-height: 1; opacity: 0; }
  #chats li:hover .del, #chats li.active .del, #chats .del:focus-visible { opacity: 1; }
  #chats .del:hover { color: var(--danger); }
  #chats .none { color: var(--muted); font-size: 14px; padding: 10px; }
  #backdrop { display: none; }
  #toggle-chats { display: none; }
  .btn.icon { display: inline-flex; padding: 0; width: 32px; min-height: 32px; align-items: center; justify-content: center; }

  .app { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 8px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 17px; margin: 0; margin-right: auto; letter-spacing: .01em; }

  /* ---- usage limits ---- */
  #limits { display: flex; gap: 12px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #limits[hidden] { display: none; }
  .limit { display: flex; align-items: center; gap: 6px; cursor: default; }
  .limit .bar { width: 44px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .limit .fill { display: block; height: 100%; background: var(--accent); }
  .limit.high .fill { background: var(--danger); }
  .limit.high .pct { color: var(--danger); font-weight: 600; }

  @media (max-width: 760px) {
    aside {
      position: fixed; inset: 0 auto 0 0; z-index: 20; width: min(300px, 86vw);
      transform: translateX(-100%); transition: transform .18s ease; visibility: hidden;
    }
    body.drawer aside { transform: none; visibility: visible; }
    body.drawer #backdrop { display: block; position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, .45); }
    #toggle-chats { display: inline-flex; }
    #chats .del { opacity: 1; }
    header { padding: 8px 12px; }
    #limits { gap: 8px; }
    .limit .bar { display: none; }
  }
  /* Too narrow for the title next to the limits: keep it for screen readers only. */
  @media (max-width: 460px) {
    header:has(#limits:not([hidden])) h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    header:has(#limits:not([hidden])) .select { margin-left: auto; }
  }
  @media (prefers-reduced-motion: reduce) { aside { transition: none; } }

  /* ---- conversation ---- */
  main { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .col { max-width: 760px; margin: 0 auto; }
  .empty { color: var(--muted); text-align: center; margin-top: 18vh; }
  .empty strong { display: block; color: var(--text); font-size: 22px; margin-bottom: 6px; }

  .msg { margin: 0 0 20px; overflow-wrap: anywhere; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .body { background: var(--user); border-radius: 16px; padding: 9px 15px; max-width: 85%; white-space: pre-wrap; }
  .msg.assistant .body > :first-child { margin-top: 0; }
  .msg.assistant .body > :last-child { margin-bottom: 0; }
  .msg.error .body { color: var(--danger); border: 1px solid currentColor; border-radius: 10px; padding: 9px 13px; }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .body p, .body ul, .body ol, .body pre { margin: 0 0 12px; }
  .body h1, .body h2, .body h3, .body h4 { margin: 18px 0 8px; line-height: 1.3; }
  .body h1 { font-size: 1.35em; } .body h2 { font-size: 1.2em; } .body h3, .body h4 { font-size: 1.05em; }
  .body ul, .body ol { padding-left: 24px; }
  .body code { background: var(--code); border-radius: 4px; padding: 1px 5px; font: 0.9em ui-monospace, SFMono-Regular, Menlo, monospace; }
  .body pre { background: var(--code); border-radius: 10px; padding: 12px 14px; overflow-x: auto; }
  .body pre code { background: none; padding: 0; }
  .body a { color: var(--accent); }
  .body hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
  .tablewrap { overflow-x: auto; margin: 0 0 12px; }
  .body table { border-collapse: collapse; }
  .body th, .body td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; vertical-align: top; }
  .cursor::after { content: "▍"; color: var(--muted); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cursor::after { animation: none; } }

  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px; }
  /* The message box and the Send button form one control. */
  form.composer {
    display: flex; align-items: stretch;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  }
  form.composer:focus-within { border-color: var(--accent); }
  textarea {
    flex: 1; resize: none; max-height: 40vh; min-height: 40px; padding: 8px 12px;
    background: transparent; border: 0;
  }
  form.composer textarea:focus-visible { outline: none; }
  form.composer .btn { min-height: 40px; min-width: 64px; border: 0; border-left: 1px solid var(--line); border-radius: 0; }
  form.composer .btn.primary { border-left-color: var(--accent); }
  form.composer .btn:focus-visible { outline-offset: -3px; }

  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); padding: 20px; width: min(480px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  dialog h2 { margin: 0 0 14px; font-size: 18px; }
  dialog label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
  dialog input, dialog textarea { width: 100%; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  dialog textarea { min-height: 90px; resize: vertical; max-height: none; }
  dialog .hint { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
  dialog .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  dialog p.what { margin: 0; overflow-wrap: anywhere; }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: var(--panel); font-weight: 600; }
</style>
</head>
<body>
<aside id="sidebar" aria-label="Chats">
  <div class="top"><button class="btn" id="new" type="button">New chat</button></div>
  <ul id="chats"></ul>
</aside>
<div id="backdrop"></div>

<div class="app">
  <header>
    <button class="btn icon" id="toggle-chats" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Chats" title="Chats">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <h1>JeanClaude</h1>
    <div id="limits" role="group" aria-label="Usage limits" hidden></div>
    <label class="sr" for="model">Model</label>
    <span class="select">
      <select id="model"></select>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </span>
    <button class="btn icon" id="open-settings" type="button" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <main id="scroll">
    <div class="col" id="messages" aria-live="polite"></div>
  </main>

  <footer>
    <form class="col composer" id="composer">
      <label class="sr" for="input">Message</label>
      <textarea id="input" rows="1" placeholder="Type a message…" autofocus></textarea>
      <button class="btn primary" id="send" type="submit">Send</button>
    </form>
  </footer>
</div>

<dialog id="settings">
  <form method="dialog" id="settings-form">
    <h2>Settings</h2>
    <label for="api-key">API key</label>
    <input id="api-key" type="password" autocomplete="off" spellcheck="false">
    <p class="hint">Only needed if the server was started with JEANCLAUDE_API_KEY. Stored in this browser.</p>
    <label for="system">System prompt</label>
    <textarea id="system" placeholder="Leave empty to use the server's default."></textarea>
    <p class="hint">Applies to chats started after you save.</p>
    <div class="row">
      <button class="btn" type="button" id="cancel-settings">Cancel</button>
      <button class="btn primary" type="submit">Save</button>
    </div>
  </form>
</dialog>

<dialog id="confirm-delete" aria-labelledby="confirm-title">
  <form method="dialog">
    <h2 id="confirm-title">Delete chat?</h2>
    <p class="what" id="confirm-what"></p>
    <p class="hint">It will be removed from this browser.</p>
    <div class="row">
      <button class="btn" value="cancel" autofocus>Cancel</button>
      <button class="btn danger" value="delete">Delete</button>
    </div>
  </form>
</dialog>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const els = {
  messages: $('messages'), scroll: $('scroll'), input: $('input'), send: $('send'), composer: $('composer'),
  model: $('model'), settings: $('settings'), apiKey: $('api-key'), system: $('system'),
  chats: $('chats'), toggle: $('toggle-chats'),
};

// ---- storage (best effort: the page must work without it) ----
const store = {
  get(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* private mode, quota */ } },
  remove(key) { try { localStorage.removeItem(key); } catch { /* ignore */ } },
};
let settings = { apiKey: '', system: '', model: 'default', ...store.get('jc.settings', {}) };

// ---- chats ----
// Each conversation lives on the server as a claude session; here we keep its id and
// a copy of the messages for display: { id, title, sessionId, messages, updatedAt }.
// messages: [{ role: 'user' | 'assistant' | 'error', content, meta? }]
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
const newChat = () => ({ id: newId(), title: '', sessionId: '', messages: [], updatedAt: 0 });

let chats = store.get('jc.chats', []);
if (!Array.isArray(chats)) chats = [];
chats = chats.filter((c) => c && typeof c.id === 'string' && Array.isArray(c.messages));
{
  // One-time migration from the single-chat version of this page.
  const old = store.get('jc.chat', null);
  if (old && Array.isArray(old.messages) && old.messages.length) {
    const first = old.messages.find((m) => m.role === 'user');
    chats.unshift({ ...newChat(), title: titleOf(first?.content ?? ''), sessionId: old.sessionId || '', messages: old.messages, updatedAt: Date.now() });
    store.set('jc.chats', chats);
    store.set('jc.current', chats[0].id); // reopen it, as before the upgrade
  }
  store.remove('jc.chat');
}
// The open chat. A new one is not added to `chats` until its first message is sent.
let chat = chats.find((c) => c.id === store.get('jc.current', '')) ?? newChat();
let controller = null; // AbortController while a reply is streaming

function titleOf(text) {
  return text.replace(/\s+/g, ' ').trim().slice(0, 80) || 'New chat';
}
function saveChats() {
  store.set('jc.chats', chats.map((c) => ({ ...c, messages: c.messages.filter((m) => m.role !== 'error') })));
  store.set('jc.current', chat.id);
}

// ---- minimal, safe markdown: everything is escaped first, then a few patterns become tags ----
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function inline(text) {
  let s = esc(text);
  const codes = [];
  s = s.replace(/`([^`\n]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`);
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\s][^*\n]*)\*/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
}

const LIST = /^\s*([-*+]|\d+[.)])\s+/;
const isTableRow = (l) => /^\s*\|.*\|\s*$/.test(l);
const isTableSep = (l) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
const cells = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());

function markdown(src) {
  const lines = src.replace(/\r\n?/g, '\n').split('\n');
  const startsTable = (i) => isTableRow(lines[i]) && i + 1 < lines.length && isTableSep(lines[i + 1]);
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      const code = [];
      i++;
      while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) code.push(lines[i++]);
      i++; // closing fence (may be missing while streaming)
      out.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`);
    } else if (/^\s*$/.test(line)) {
      i++;
    } else if (/^#{1,4}\s/.test(line)) {
      const level = line.match(/^#+/)[0].length;
      out.push(`<h${level}>${inline(line.replace(/^#+\s+/, ''))}</h${level}>`);
      i++;
    } else if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) {
      out.push('<hr>');
      i++;
    } else if (startsTable(i)) {
      const head = cells(line);
      const rows = [];
      i += 2;
      while (i < lines.length && isTableRow(lines[i])) rows.push(cells(lines[i++]));
      out.push(
        '<div class="tablewrap"><table><thead><tr>' + head.map((c) => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>' +
        rows.map((r) => '<tr>' + r.map((c) => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>',
      );
    } else if (LIST.test(line)) {
      const ordered = /^\s*\d/.test(line);
      const items = [];
      while (i < lines.length && LIST.test(lines[i]) && /^\s*\d/.test(lines[i]) === ordered) {
        let item = lines[i++].replace(LIST, '');
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !LIST.test(lines[i])) item += ' ' + lines[i++].trim();
        items.push(`<li>${inline(item)}</li>`);
      }
      out.push(ordered ? `<ol>${items.join('')}</ol>` : `<ul>${items.join('')}</ul>`);
    } else {
      const para = [];
      while (
        i < lines.length && !/^\s*$/.test(lines[i]) && !/^\s*```/.test(lines[i]) &&
        !/^#{1,4}\s/.test(lines[i]) && !LIST.test(lines[i]) && !startsTable(i)
      ) para.push(lines[i++]);
      out.push(`<p>${para.map(inline).join('<br>')}</p>`);
    }
  }
  return out.join('');
}

// ---- rendering ----
const nearBottom = () => els.scroll.scrollHeight - els.scroll.scrollTop - els.scroll.clientHeight < 120;
const toBottom = () => { els.scroll.scrollTop = els.scroll.scrollHeight; };

function metaText(meta) {
  const parts = [];
  if (meta?.model) parts.push(meta.model);
  if (typeof meta?.ms === 'number') parts.push((meta.ms / 1000).toFixed(1) + ' s');
  if (typeof meta?.cost === 'number') parts.push('$' + meta.cost.toFixed(4));
  return parts.join(' · ');
}

function messageEl(m) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${m.role}`;
  const body = document.createElement('div');
  body.className = 'body';
  if (m.role === 'assistant') body.innerHTML = markdown(m.content);
  else body.textContent = m.content;
  wrap.append(body);
  if (m.meta) {
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = metaText(m.meta);
    wrap.append(meta);
  }
  return wrap;
}

function renderMessages() {
  els.messages.replaceChildren();
  if (chat.messages.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = '<strong>What can I help with?</strong>Enter to send, Shift+Enter for a new line.';
    els.messages.append(empty);
  }
  for (const m of chat.messages) els.messages.append(messageEl(m));
  toBottom();
}

function renderChats() {
  els.chats.replaceChildren();
  if (chats.length === 0) {
    const none = document.createElement('li');
    none.className = 'none';
    none.textContent = 'No chats yet.';
    els.chats.append(none);
    return;
  }
  for (const c of chats.slice().sort((a, b) => b.updatedAt - a.updatedAt)) {
    const li = document.createElement('li');
    if (c.id === chat.id) li.className = 'active';
    const open = document.createElement('button');
    open.type = 'button';
    open.className = 'open';
    open.textContent = c.title || 'New chat';
    open.title = c.title || '';
    if (c.id === chat.id) open.setAttribute('aria-current', 'true');
    open.addEventListener('click', () => openChat(c));
    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'del';
    del.textContent = '×';
    del.setAttribute('aria-label', `Delete chat: ${c.title || 'New chat'}`);
    del.addEventListener('click', () => deleteChat(c));
    li.append(open, del);
    els.chats.append(li);
  }
}

function render() {
  renderChats();
  renderMessages();
}

function setBusy(busy) {
  els.send.textContent = busy ? 'Stop' : 'Send';
  els.send.classList.toggle('primary', !busy);
}

function autosize() {
  els.input.style.height = 'auto';
  els.input.style.height = els.input.scrollHeight + 2 + 'px';
}

function setDrawer(open) {
  document.body.classList.toggle('drawer', open);
  els.toggle.setAttribute('aria-expanded', String(open));
}

// ---- switching between chats ----
function show(next) {
  if (controller) controller.abort(); // the reply so far is kept in the chat it belongs to
  chat = next;
  saveChats();
  render();
  setDrawer(false);
  els.input.focus();
}
const openChat = (c) => { if (c.id !== chat.id) show(c); else setDrawer(false); };

function deleteChat(c) {
  const dialog = $('confirm-delete');
  $('confirm-what').textContent = c.title || 'New chat';
  dialog.returnValue = 'cancel';
  dialog.addEventListener('close', () => {
    if (dialog.returnValue !== 'delete') return;
    chats = chats.filter((x) => x.id !== c.id);
    if (c.id === chat.id) show(newChat());
    else { saveChats(); renderChats(); }
  }, { once: true });
  dialog.showModal();
}

// ---- talking to the server ----
function headers() {
  const h = { 'content-type': 'application/json' };
  if (settings.apiKey) h.authorization = `Bearer ${settings.apiKey}`;
  return h;
}

class ServerError extends Error {
  constructor(message, status) { super(message); this.status = status; }
}

async function toServerError(res) {
  if (res.status === 401) return new ServerError('The server needs an API key. Add it in Settings and try again.', 401);
  let detail = '';
  try {
    const body = await res.json();
    detail = body?.claude?.result ?? body?.error?.message ?? body?.error ?? '';
  } catch { /* not JSON */ }
  return new ServerError(detail ? `${detail} (HTTP ${res.status})` : `Request failed (HTTP ${res.status})`, res.status);
}

async function loadModels() {
  let ids = ['default'];
  try {
    const res = await fetch('v1/models', { headers: headers() });
    if (res.ok) ids = (await res.json()).data.map((m) => m.id);
  } catch { /* keep the fallback */ }
  if (!ids.includes(settings.model)) settings.model = ids[0];
  els.model.replaceChildren(...ids.map((id) => new Option(id, id, false, id === settings.model)));
}

/** POSTs one message and calls onDelta for each piece of the reply. Returns claude's result object. */
async function streamMessage({ message, sessionId, signal, onDelta }) {
  const res = await fetch('message', {
    method: 'POST',
    headers: headers(),
    signal,
    body: JSON.stringify({
      message,
      stream: true,
      model: settings.model,
      ...(sessionId ? { sessionId } : {}),
      ...(settings.system.trim() ? { system: settings.system } : {}),
    }),
  });
  if (!res.ok) throw await toServerError(res);

  const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
  let buffer = '';
  let result = null;
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += value;
    let end;
    while ((end = buffer.indexOf('\n\n')) >= 0) {
      const lines = buffer.slice(0, end).split('\n');
      buffer = buffer.slice(end + 2);
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const event = JSON.parse(line.slice(5));
        if (event.type === 'delta') onDelta(event.text);
        else if (event.type === 'limits') setLimits(event.limits);
        else if (event.type === 'result') result = event.result;
        else if (event.type === 'error') throw new ServerError(event.error || 'The server reported an error.', 502);
      }
    }
  }
  return result;
}

// ---- usage limits ----
// claude reports how much of the subscription's usage windows is used up with each
// reply. Keep the last report so the header shows it after a reload too.
const LIMIT_NAMES = { five_hour: ['5h', '5-hour limit'], seven_day: ['7d', 'Weekly limit'] };
let limits = store.get('jc.limits', null);

function setLimits(info) {
  limits = info;
  store.set('jc.limits', info);
  renderLimits();
}

function windowsOf(info) {
  if (!info) return [];
  if (info.unifiedWindows && typeof info.unifiedWindows === 'object') return Object.entries(info.unifiedWindows);
  if (info.rateLimitType && typeof info.utilization === 'number') return [[info.rateLimitType, info]];
  return [];
}

function resetText(seconds) {
  const at = new Date(seconds * 1000);
  const sameDay = at.toDateString() === new Date().toDateString();
  return sameDay
    ? at.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
    : at.toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' });
}

function renderLimits() {
  const box = $('limits');
  const items = windowsOf(limits).filter(([, w]) => w && typeof w.utilization === 'number');
  box.hidden = !items.length;
  box.replaceChildren(...items.map(([key, w]) => {
    const [short, long] = LIMIT_NAMES[key] ?? [key.replace(/_/g, ' '), key.replace(/_/g, ' ')];
    // Past the reset time the stored number is stale; the next reply brings a fresh one.
    const expired = typeof w.resetsAt === 'number' && w.resetsAt * 1000 <= Date.now();
    const pct = Math.round(Math.min(Math.max(w.utilization, 0), 1) * 100);
    const el = document.createElement('div');
    el.className = 'limit' + (!expired && (pct >= 90 || (w.status && w.status !== 'allowed')) ? ' high' : '');
    el.title = expired
      ? `${long}: reset since — send a message to refresh`
      : `${long}: ${pct}% used` + (typeof w.resetsAt === 'number' ? `, resets ${resetText(w.resetsAt)}` : '');
    const label = document.createElement('span');
    label.textContent = short;
    const bar = document.createElement('span');
    bar.className = 'bar';
    const fill = document.createElement('span');
    fill.className = 'fill';
    fill.style.width = (expired ? 0 : pct) + '%';
    bar.append(fill);
    const value = document.createElement('span');
    value.className = 'pct';
    value.textContent = expired ? '–' : pct + '%';
    el.append(label, bar, value);
    el.setAttribute('aria-label', el.title);
    return el;
  }));
}

/** Used when the server no longer has our session (e.g. it was restarted): replay the chat as text. */
function withTranscript(earlier, message) {
  const transcript = earlier.map((m) => `### ${m.role === 'user' ? 'User' : 'Assistant'}\n${m.content}`).join('\n\n');
  return (
    'This is our conversation so far. Continue it by answering the last User message — reply with the answer only.\n\n' +
    `${transcript}\n\n### User\n${message}`
  );
}

async function send(text) {
  // `chat` may point to another conversation by the time the reply ends, so hold on to this one.
  const mine = chat;
  mine.messages = mine.messages.filter((m) => m.role !== 'error');
  const earlier = mine.messages.slice();
  mine.messages.push({ role: 'user', content: text });
  if (!chats.includes(mine)) {
    mine.title = titleOf(text);
    chats.push(mine);
  }
  mine.updatedAt = Date.now();
  saveChats();
  render();

  const reply = { role: 'assistant', content: '' };
  const el = messageEl(reply);
  const body = el.firstChild;
  body.classList.add('cursor');
  els.messages.append(el);
  toBottom();

  const myController = new AbortController();
  controller = myController;
  setBusy(true);
  let frame = 0;
  const onDelta = (piece) => {
    reply.content += piece;
    if (frame || chat !== mine) return;
    frame = requestAnimationFrame(() => {
      frame = 0;
      const stick = nearBottom();
      body.innerHTML = markdown(reply.content);
      if (stick) toBottom();
    });
  };

  let failure = '';
  let result = null;
  const started = performance.now();
  try {
    // Without a server session (lost earlier, or the first reply never arrived) the
    // model has no memory of this chat, so replay it as text.
    const replay = earlier.length ? withTranscript(earlier, text) : text;
    const request = { message: mine.sessionId ? text : replay, sessionId: mine.sessionId, signal: myController.signal, onDelta };
    try {
      result = await streamMessage(request);
    } catch (err) {
      // A 502 before any text, on a resumed chat, most likely means the session is gone.
      const sessionLost = err instanceof ServerError && err.status === 502 && mine.sessionId && !reply.content;
      if (!sessionLost) throw err;
      mine.sessionId = '';
      result = await streamMessage({ ...request, sessionId: '', message: replay });
    }
  } catch (err) {
    if (err.name !== 'AbortError') failure = err.message || 'Could not reach the server.';
  }

  if (frame) cancelAnimationFrame(frame);
  if (controller === myController) {
    controller = null;
    setBusy(false);
  }
  if (result?.session_id) mine.sessionId = result.session_id;
  if (!reply.content && result?.result) reply.content = String(result.result);
  if (reply.content) {
    // keep what arrived, even if stopped or failed midway
    reply.meta = {
      model: settings.model,
      ms: Math.round(performance.now() - started),
      ...(typeof result?.total_cost_usd === 'number' ? { cost: result.total_cost_usd } : {}),
    };
    mine.messages.push(reply);
  }
  if (failure) mine.messages.push({ role: 'error', content: failure });
  mine.updatedAt = Date.now();
  saveChats();
  if (chat === mine) {
    render();
    els.input.focus();
  } else {
    renderChats();
  }
}

// ---- events ----
els.composer.addEventListener('submit', (e) => {
  e.preventDefault();
  if (controller) { controller.abort(); return; }
  const text = els.input.value.trim();
  if (!text) return;
  els.input.value = '';
  autosize();
  send(text);
});
els.input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    if (!controller) els.composer.requestSubmit();
  }
});
els.input.addEventListener('input', autosize);

els.model.addEventListener('change', () => {
  settings.model = els.model.value;
  store.set('jc.settings', settings);
});
$('new').addEventListener('click', () => show(newChat()));
els.toggle.addEventListener('click', () => setDrawer(!document.body.classList.contains('drawer')));
$('backdrop').addEventListener('click', () => setDrawer(false));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setDrawer(false); });

$('open-settings').addEventListener('click', () => {
  els.apiKey.value = settings.apiKey;
  els.system.value = settings.system;
  els.settings.showModal();
});
$('cancel-settings').addEventListener('click', () => els.settings.close());
$('settings-form').addEventListener('submit', () => {
  settings.apiKey = els.apiKey.value.trim();
  settings.system = els.system.value;
  store.set('jc.settings', settings);
  loadModels();
});

render();
renderLimits();
setInterval(renderLimits, 60_000); // notice when a window resets
loadModels();
</script>
</body>
</html>
